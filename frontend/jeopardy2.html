<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Quiz — Howard Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='16' height='16' x='0' y='0' fill='%23f4c75c'/%3E%3Crect width='16' height='16' x='16' y='0' fill='%23f5efe1'/%3E%3Crect width='16' height='16' x='0' y='16' fill='%23f5efe1'/%3E%3Crect width='16' height='16' x='16' y='16' fill='%23c8102e'/%3E%3C/svg%3E">

<!-- React from CDN — no build step needed -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<!-- Babel translates JSX in the browser -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
:root {
  --ink: #0a1128;
  --ink2: #111a3d;
  --jeopardy: #0d12b1;
  --jeopardy-deep: #030788;
  --gold: #bd1111;
  --gold-deep: #930a13;
  --cream: #f5efe1;
  --paper: #faf7ef;
  --crimson: #c8102e;
  --emerald: #2d8659;
  --slate: #6b7693;
  --slate2: #8a93ad;
  --line: rgba(10, 17, 40, 0.12);
  --line-strong: rgba(10, 17, 40, 0.32);
  --display: 'Fraunces', Georgia, serif;
  --sans: 'DM Sans', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  background: var(--paper);
  font-family: var(--sans);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
}

button { font-family: inherit; cursor: pointer; border: none; background: none; }
input { font-family: inherit; }

#root {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.screen {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Loader */
.boot {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 16px;
  font-family: var(--display);
  color: var(--ink);
}
.boot-spinner {
  width: 24px; height: 24px;
  border: 2px solid var(--line);
  border-top-color: var(--jeopardy);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ LOGIN ============ */
.login { display: flex; height: 100%; }
.login-left {
  flex: 1.1;
  background: var(--ink);
  color: var(--cream);
  padding: 48px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
}
.login-left::before {
  content: '';
  position: absolute;
  top: -60px; right: -60px;
  width: 240px; height: 240px;
  border-radius: 50%;
  background: repeating-linear-gradient(45deg, transparent 0, transparent 10px, rgba(244, 199, 92, 0.08) 10px, rgba(244, 199, 92, 0.08) 11px);
}
.login-brand {
  font-family: var(--display);
  font-size: 16px;
  color: var(--gold);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-weight: 500;
}
.login-headline {
  font-family: var(--display);
  font-weight: 300;
  font-size: clamp(40px, 5vw, 64px);
  line-height: 0.95;
  letter-spacing: -0.02em;
  position: relative;
  z-index: 1;
}
.login-headline em { color: var(--gold); font-style: italic; }
.login-subhead {
  margin-top: 24px;
  font-size: 14px;
  color: var(--slate2);
  max-width: 340px;
  line-height: 1.5;
}
.login-footer {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--slate2);
  text-transform: uppercase;
}
.login-right {
  flex: 1;
  padding: 48px;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.login-title {
  font-family: var(--display);
  font-size: 28px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.login-sub {
  font-size: 14px;
  color: var(--slate);
  margin-top: 8px;
  margin-bottom: 32px;
  line-height: 1.5;
}
.gbutton {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 20px;
  border-radius: 4px;
  background: white;
  border: 1px solid var(--line-strong);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  transition: box-shadow 0.15s;
}
.gbutton:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
.glogo {
  width: 18px; height: 18px;
  background: conic-gradient(from 0deg at 50% 50%, #ea4335 0deg 90deg, #fbbc05 90deg 180deg, #34a853 180deg 270deg, #4285f4 270deg 360deg);
  border-radius: 50%;
  position: relative;
}
.glogo::after {
  content: '';
  position: absolute;
  inset: 4px;
  background: white;
  border-radius: 50%;
}
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0;
  font-size: 10px;
  color: var(--slate);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--line);
}
.code-input {
  border: 1px dashed var(--line-strong);
  padding: 14px 16px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 13px;
  letter-spacing: 0.1em;
  outline: none;
  width: 100%;
  background: transparent;
}
.code-input::placeholder { color: var(--slate); }
.legal {
  margin-top: 24px;
  font-size: 11px;
  color: var(--slate);
  line-height: 1.5;
}
.legal a { color: var(--jeopardy); text-decoration: underline; }

/* ============ TOPBAR ============ */
.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 28px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--display);
  font-weight: 600;
  font-size: 18px;
}
.brand-mark {
  width: 20px; height: 20px;
  display: grid;
  grid-template: repeat(2, 1fr) / repeat(2, 1fr);
  gap: 1px;
}
.brand-mark > div:nth-child(1) { background: var(--gold); }
.brand-mark > div:nth-child(2) { background: var(--cream); }
.brand-mark > div:nth-child(3) { background: var(--cream); }
.brand-mark > div:nth-child(4) { background: var(--crimson); }
.topbar-right {
  display: flex;
  align-items: center;
  gap: 20px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--slate);
  letter-spacing: 0.08em;
}
.avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold) 0%, var(--crimson) 100%);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--display);
  color: white;
  font-weight: 600;
  font-size: 12px;
}

/* ============ HOME ============ */
.home-body {
  flex: 1;
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 32px;
  padding: 40px;
  overflow: auto;
}
.hero {
  background: var(--jeopardy);
  color: var(--cream);
  border-radius: 8px;
  padding: 36px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
  min-height: 360px;
}
.hero::after {
  content: '$';
  position: absolute;
  right: -40px; bottom: -90px;
  font-family: var(--display);
  font-size: 320px;
  font-weight: 700;
  color: rgba(244, 199, 92, 0.14);
  line-height: 1;
  pointer-events: none;
}
.hero-label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.hero-title {
  font-family: var(--display);
  font-weight: 300;
  font-size: 48px;
  line-height: 1;
  letter-spacing: -0.02em;
  position: relative;
  z-index: 1;
}
.hero-title em { color: var(--gold); font-style: italic; }
.btn-gold {
  align-self: flex-start;
  background: var(--gold);
  color: var(--ink);
  padding: 12px 22px;
  border-radius: 4px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  position: relative;
  z-index: 1;
  transition: transform 0.15s;
}
.btn-gold:hover { transform: translateY(-1px); }
.home-side {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.side-card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 20px;
}
.side-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--slate);
  text-transform: uppercase;
  margin-bottom: 10px;
}
.side-code {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 700;
  color: var(--jeopardy);
  letter-spacing: 0.12em;
}
.side-meta {
  font-size: 11px;
  color: var(--slate);
  margin-top: 6px;
}
.lead-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  font-size: 12px;
  border-bottom: 1px dashed var(--line);
}
.lead-row:last-child { border-bottom: none; }
.lead-pos {
  font-family: var(--display);
  font-style: italic;
  color: var(--gold-deep);
  font-weight: 600;
  margin-right: 8px;
}
.lead-score { font-family: var(--mono); font-weight: 600; }

/* ============ GAME BOARD ============ */
.game-screen {
  background: var(--ink);
  color: var(--cream);
  height: 100%;
  display: flex;
  flex-direction: column;
}
.game-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 24px;
  background: var(--ink2);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  flex-shrink: 0;
}
.score-pill {
  background: var(--gold);
  color: var(--ink);
  padding: 4px 14px;
  border-radius: 14px;
  font-weight: 700;
  letter-spacing: 0.05em;
}
.btn-quit {
  background: transparent;
  border: 1px solid var(--slate);
  color: var(--slate2);
  padding: 4px 12px;
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
}
.btn-quit:hover { color: var(--cream); border-color: var(--cream); }
.board {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  grid-template-rows: auto repeat(5, 1fr);
  gap: 4px;
  padding: 12px;
  min-height: 0;
}
.cat-header {
  background: var(--jeopardy-deep);
  color: var(--cream);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 14px 6px;
  font-family: var(--display);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  border-radius: 2px;
}
.tile {
  background: var(--jeopardy);
  color: var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--display);
  font-weight: 700;
  font-size: 32px;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
  border-radius: 2px;
  position: relative;
  transition: background 0.15s;
}
.tile:hover:not(.visited) { background: #0a15f0; }
.tile.visited {
  background: var(--ink2);
  color: rgba(244, 199, 92, 0.3);
  font-family: var(--sans);
  font-size: 20px;
  text-shadow: none;
  cursor: default;
  font-weight: 400;
}
.tile.howard::before {
  content: '';
  position: absolute;
  top: 8px; right: 8px;
  width: 8px; height: 8px;
  background: var(--crimson);
  border-radius: 50%;
}
.tile.visited.howard::before { display: none; }

/* ============ MODAL ============ */
.modal-overlay {
  position: absolute;
  inset: 0;
  background: rgba(10, 17, 40, 0.85);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 10;
}
.modal {
  width: 100%;
  max-width: 560px;
  background: var(--jeopardy);
  color: var(--cream);
  padding: 36px 40px;
  border-radius: 8px;
  box-shadow: 0 0 0 1px var(--gold), 0 40px 80px rgba(0,0,0,0.5);
}
.modal-meta {
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 20px;
}
.modal-value {
  font-family: var(--display);
  font-weight: 700;
  font-size: 32px;
  color: var(--gold);
}
.modal-value.struck { text-decoration: line-through; opacity: 0.5; }
.modal-clue {
  font-family: var(--display);
  font-weight: 400;
  font-size: 22px;
  line-height: 1.35;
  margin-bottom: 20px;
}
.hint-banner {
  background: var(--gold);
  color: var(--ink);
  padding: 10px 16px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.hint-banner em {
  font-family: var(--display);
  font-style: italic;
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0;
}
.hint-text {
  background: rgba(244, 199, 92, 0.12);
  border-left: 3px solid var(--gold);
  padding: 12px 16px;
  font-size: 14px;
  line-height: 1.5;
  font-style: italic;
  margin-bottom: 20px;
  color: var(--cream);
}
.modal-input {
  width: 100%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(244, 199, 92, 0.4);
  padding: 14px 16px;
  border-radius: 4px;
  color: var(--cream);
  font-family: var(--mono);
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
}
.modal-input:focus { border-color: var(--gold); }
.modal-input::placeholder { color: rgba(245, 239, 225, 0.4); }
.modal-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 20px;
}
.btn-hint {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--gold);
  text-transform: uppercase;
  padding: 10px 14px;
  border: 1px solid var(--gold);
  border-radius: 3px;
  background: transparent;
}
.btn-hint:disabled {
  opacity: 0.4;
  cursor: default;
  color: var(--slate2);
  border-color: var(--slate2);
}
.modal-actions-right {
  display: flex;
  gap: 8px;
}
.btn-close {
  background: transparent;
  border: 1px solid var(--slate);
  color: var(--slate2);
  padding: 10px 16px;
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 600;
}
.btn-submit {
  background: var(--gold);
  color: var(--ink);
  padding: 10px 22px;
  border-radius: 3px;
  font-weight: 700;
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.btn-submit:disabled { background: var(--slate); cursor: not-allowed; }

.validating {
  background: var(--ink2);
  color: var(--cream);
  border: 1px solid var(--gold);
  padding: 40px;
  border-radius: 8px;
  text-align: center;
  width: 100%;
  max-width: 440px;
}
.validating-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--gold);
  text-transform: uppercase;
}
.validating-chip-dot {
  width: 8px; height: 8px;
  background: var(--gold);
  border-radius: 50%;
  animation: pulse 1.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
.validating-text {
  font-family: var(--display);
  font-size: 20px;
  font-style: italic;
  font-weight: 300;
}

.feedback {
  width: 100%;
  max-width: 520px;
  padding: 36px 40px;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 30px 80px rgba(0,0,0,0.4);
}
.feedback.correct { background: var(--emerald); color: white; }
.feedback.wrong {
  background: var(--ink);
  color: var(--cream);
  border: 1px solid var(--crimson);
}
.feedback-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  border-radius: 12px;
  background: rgba(255,255,255,0.15);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 12px;
}
.feedback-mark {
  font-family: var(--display);
  font-size: 72px;
  font-weight: 300;
  line-height: 1;
  margin-bottom: 8px;
}
.feedback.wrong .feedback-mark { color: var(--crimson); }
.feedback-verdict {
  font-family: var(--display);
  font-size: 26px;
  font-weight: 500;
  margin-bottom: 6px;
  letter-spacing: -0.01em;
}
.feedback-detail {
  font-size: 13px;
  opacity: 0.85;
  margin-bottom: 20px;
  line-height: 1.5;
}
.answer-row {
  background: rgba(0,0,0,0.2);
  padding: 10px 16px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 13px;
  text-align: left;
  margin-bottom: 8px;
}
.answer-row.correct-answer { background: rgba(45, 134, 89, 0.15); }
.feedback.wrong .answer-row { background: rgba(200, 16, 46, 0.2); }
.feedback.wrong .answer-row.correct-answer { background: rgba(45, 134, 89, 0.15); }
.answer-label {
  font-size: 9px;
  letter-spacing: 0.15em;
  opacity: 0.7;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.answer-row.correct-answer .answer-label { color: var(--emerald); opacity: 1; }
.feedback-tap-hint {
  margin-top: 20px;
  font-size: 10px;
  opacity: 0.6;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* ============ COMPLETE ============ */
.complete {
  background: var(--ink);
  color: var(--cream);
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.complete::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(244, 199, 92, 0.15), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(200, 16, 46, 0.1), transparent 40%);
}
.complete-inner { position: relative; z-index: 1; max-width: 600px; }
.complete-label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.25em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 20px;
}
.complete-score {
  font-family: var(--display);
  font-weight: 300;
  font-size: 120px;
  color: var(--gold);
  line-height: 0.9;
  letter-spacing: -0.03em;
  margin-bottom: 8px;
}
.complete-score em { font-style: italic; font-weight: 400; }
.complete-verdict {
  font-family: var(--display);
  font-size: 22px;
  font-style: italic;
  font-weight: 300;
  margin-bottom: 36px;
}
.complete-stats {
  display: flex;
  gap: 40px;
  justify-content: center;
  margin-bottom: 32px;
}

// ============================================================
// FUZZY ANSWER VALIDATOR (no backend needed)
// In production this would POST to your Django backend, which proxies
// to Anthropic's API with the server-side key. For the demo it runs
// locally with Levenshtein-distance fuzzy matching.
// ============================================================
const levenshtein = (a, b) => {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  const matrix = Array.from({ length: b.length + 1 }, (_, i) => [i]);
  for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
  for (let i = 1; i <= b.length; i++) {
    for (let j = 1; j <= a.length; j++) {
      const cost = a[j - 1] === b[i - 1] ? 0 : 1;
      matrix[i][j] = Math.min(matrix[i - 1][j] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j - 1] + cost);
    }
  }
  return matrix[b.length][a.length];
};

const normalize = (s) =>
  s.toLowerCase()
   .replace(/[^a-z0-9\s]/g, ' ')
   .replace(/\b(the|a|an|who is|what is|whats|whos)\b/g, ' ')
   .replace(/\s+/g, ' ')
   .trim();

const validateAnswer = async (userAnswer, correctAnswer) => {
  await new Promise(r => setTimeout(r, 600 + Math.random() * 400));
  const u = normalize(userAnswer);
  const c = normalize(correctAnswer);
  if (!u || u.length < 2) return { correct: false, reason: 'Answer too short' };
  if (u === c) return { correct: true, reason: 'Exact match' };
  if (c.includes(u) && u.length >= Math.min(c.length * 0.5, 6))
    return { correct: true, reason: 'Recognized the key term' };
  if (u.includes(c)) return { correct: true, reason: 'Recognized the key term' };
  const dist = levenshtein(u, c);
  const tolerance = Math.max(2, Math.floor(c.length * 0.2));
  if (dist <= tolerance) return { correct: true, reason: 'Close enough — minor typo' };
  const cWords = c.split(' ').filter(w => w.length > 2);
  const uWords = u.split(' ').filter(w => w.length > 2);
  if (cWords.length > 0 && uWords.length > 0) {
    const matches = cWords.filter(cw =>
      uWords.some(uw => levenshtein(cw, uw) <= Math.max(1, Math.floor(cw.length * 0.25)))
    );
    if (matches.length === cWords.length) return { correct: true, reason: 'All key terms present' };
  }
  return { correct: false, reason: 'Not a close enough match' };
};

// ============================================================

const GameScreen = ({ boardCode, onComplete, onQuit }) => {
  const [score, setScore] = useState(0);
  const [visited, setVisited] = useState({});
  const [selectedKey, setSelectedKey] = useState(null);
  const [isHintActive, setIsHintActive] = useState(false);
  const [userAnswer, setUserAnswer] = useState('');
  const [modalState, setModalState] = useState('closed');
  const [feedback, setFeedback] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [correctCount, setCorrectCount] = useState(0);
  const [hintsUsed, setHintsUsed] = useState(0);
  const startTime = useRef(Date.now());
  const inputRef = useRef(null);

  // Timer
  useEffect(() => {
    const id = setInterval(() => {
      setElapsed(Math.floor((Date.now() - startTime.current) / 1000));
    }, 1000);
    return () => clearInterval(id);
  }, []);

  // Auto-focus input when question opens
  useEffect(() => {
    if (modalState === 'question' && inputRef.current) {
      setTimeout(() => inputRef.current?.focus(), 50);
    }
  }, [modalState]);

  const visitedCount = Object.keys(visited).length;

  // Detect completion
  useEffect(() => {
    if (visitedCount === 25) {
      setTimeout(() => onComplete({
        score, elapsed, correctCount, hintsUsed, boardCode
      }), 500);
    }
  }, [visitedCount, score, elapsed, correctCount, hintsUsed, boardCode, onComplete]);

  const handleTileClick = (cat, idx) => {
    const key = cat + '-' + idx;
    if (visited[key]) return;
    setSelectedKey(key);
    setUserAnswer('');
    setIsHintActive(false);
    setModalState('question');
  };

  const [cat, idxStr] = selectedKey ? selectedKey.split('-') : [null, null];
  const question = cat && idxStr !== null ? QUESTIONS[cat][parseInt(idxStr)] : null;

  const handleSubmit = async () => {
    if (!userAnswer.trim() || !question) return;
    setModalState('validating');
    const result = await validateAnswer(userAnswer, question.answer);
    const payout = isHintActive ? question.value / 2 : question.value;
    const delta = result.correct ? payout : 0;
    if (result.correct) setCorrectCount(c => c + 1);
    setScore(s => s + delta);
    setFeedback({
      correct: result.correct,
      reason: result.reason,
      userAnswer,
      correctAnswer: question.answer,
      delta
    });
    setModalState('feedback');
  };

  const handleHint = () => {
    if (isHintActive) return;
    setIsHintActive(true);
    setHintsUsed(h => h + 1);
  };

  const handleCloseFeedback = () => {
    if (!selectedKey) return;
    setVisited(v => ({ ...v, [selectedKey]: true }));
    setModalState('closed');
    setSelectedKey(null);
    setFeedback(null);
    setIsHintActive(false);
    setUserAnswer('');
  };

  const handleCloseQuestion = () => {
    setModalState('closed');
    setSelectedKey(null);
    setIsHintActive(false);
    setUserAnswer('');
  };

  // Keyboard shortcuts
  useEffect(() => {
    const handler = (e) => {
      if (modalState === 'question') {
        if (e.key === 'Escape') handleCloseQuestion();
      } else if (modalState === 'feedback') {
        if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          handleCloseFeedback();
        }
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [modalState, selectedKey]);

  return (
    <div className="screen game-screen">
      <div className="game-topbar">
        <span>BOARD · {boardCode}</span>
        <span>TILES · {visitedCount} / 25</span>
        <span className="score-pill">$ {fmtMoney(score)}</span>
        <span>{fmtTime(elapsed)}</span>
        <button className="btn-quit" onClick={onQuit}>QUIT</button>
      </div>

      <div className="board">
        {CATEGORIES.map(c => <div key={c} className="cat-header">{c}</div>)}
        {VALUES.map((_, rowIdx) =>
          CATEGORIES.map(c => {
            const q = QUESTIONS[c][rowIdx];
            const key = c + '-' + rowIdx;
            const isVisited = !!visited[key];
            const classes = ['tile'];
            if (isVisited) classes.push('visited');
            if (q.howard) classes.push('howard');
            return (
              <button
                key={key}
                className={classes.join(' ')}
                onClick={() => handleTileClick(c, rowIdx)}
                disabled={isVisited}
              >
                {isVisited ? '✓' : '$' + q.value}
              </button>
            );
          })
        )}
      </div>

      {modalState !== 'closed' && question && (
        <div
          className="modal-overlay"
          onClick={(e) => {
            if (e.target === e.currentTarget && modalState === 'question') handleCloseQuestion();
          }}
        >
          {modalState === 'question' && (
            <div className="modal" onClick={(e) => e.stopPropagation()}>
              {isHintActive && (
                <div className="hint-banner">
                  <span>Hint Active</span>
                  <em>Reward reduced to ${question.value / 2}</em>
                </div>
              )}
              <div className="modal-meta">
                <span>{cat} · {question.howard ? '★ ' : ''}{question.value}pt tile</span>
                <span className={'modal-value' + (isHintActive ? ' struck' : '')}>${question.value}</span>
              </div>
              <div className="modal-clue">{question.clue}</div>
              {isHintActive && <div className="hint-text">{question.hint}</div>}
              <input
                ref={inputRef}
                type="text"
                className="modal-input"
                placeholder="What is / Who is..."
                value={userAnswer}
                onChange={(e) => setUserAnswer(e.target.value)}
                onKeyDown={(e) => { if (e.key === 'Enter') handleSubmit(); }}
                autoComplete="off"
              />
              <div className="modal-actions">
                <button className="btn-hint" onClick={handleHint} disabled={isHintActive}>
                  {isHintActive ? 'Hint Used' : 'Use Hint · −50%'}
                </button>
                <div className="modal-actions-right">
                  <button className="btn-close" onClick={handleCloseQuestion}>Close</button>
                  <button className="btn-submit" onClick={handleSubmit} disabled={!userAnswer.trim()}>
                    Submit
                  </button>
                </div>
              </div>
            </div>
          )}

          {modalState === 'validating' && (
            <div className="validating">
              <div className="validating-chip">
                <span className="validating-chip-dot"></span>
                Grading your answer
              </div>
              <div className="validating-text">Checking semantic match...</div>
            </div>
          )}

          {modalState === 'feedback' && feedback && (
            <div
              className={'feedback ' + (feedback.correct ? 'correct' : 'wrong')}
              onClick={handleCloseFeedback}
            >
              <div className="feedback-chip">Smart match</div>
              <div className="feedback-mark">{feedback.correct ? '✓' : '✗'}</div>
              <div className="feedback-verdict">{feedback.correct ? 'Correct' : 'Not quite'}</div>
              <div className="feedback-detail">
                {feedback.correct
                  ? '+ $' + fmtMoney(feedback.delta) + ' · ' + feedback.reason
                  : feedback.reason}
              </div>
              <div className="answer-row">
                <div className="answer-label">Your answer</div>
                {feedback.userAnswer}
              </div>
              {!feedback.correct && (
                <div className="answer-row correct-answer">

                  {feedback.correctAnswer}
                </div>
              )}
              <div className="feedback-tap-hint">Tap to continue</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
};

          </div>

        </div>
      </div>
    </div>
  );
};

// ============================================================
// LEADERBOARD
// ============================================================
const LeaderboardScreen = ({ result, boardCode, onHome }) => {
  let merged = [...INITIAL_LEADERBOARD];
  if (result) {
    merged = [...merged, {
      name: 'jmonroe · you',
      score: result.score,
      time: fmtTime(result.elapsed),
      isMe: true
    }].sort((a, b) => b.score - a.score);
  }
  const numerals = ['i.', 'ii.', 'iii.', 'iv.', 'v.', 'vi.', 'vii.', 'viii.', 'ix.', 'x.'];

  return (
    <div className="screen">
      <TopBar>
        <span>BOARD · {boardCode}</span>
        <Avatar />
      </TopBar>
      <div className="leader-body">
        <div className="leader-title-row">
          <div className="leader-title">Top <em>Scores</em></div>
          <div className="leader-code">{merged.length} players · board {boardCode}</div>
        </div>
        <div className="leader-row head">
          <span>#</span>
          <span>Player</span>
          <span style={{ textAlign: 'right' }}>Score</span>
          <span style={{ textAlign: 'right' }}>Finished</span>
        </div>
        {merged.map((p, i) => (
          <div key={i} className={'leader-row' + (p.isMe ? ' me' : '')}>
            <span className={'leader-rank' + (i === 0 ? ' top' : '')}>
              {numerals[i] || (i + 1) + '.'}
            </span>
            <span className="leader-name">{p.name}</span>
            <span className="leader-score">${fmtMoney(p.score)}</span>
            <span className="leader-time">{p.time}</span>
          </div>
        ))}
        <div className="leader-actions">
          <button className="btn-dark" onClick={onHome}>Back to Home</button>
        </div>
      </div>
    </div>
  );
};

// ============================================================
// ROOT
// ============================================================
const App = () => {
  const [screen, setScreen] = useState('login');
  const [boardCode, setBoardCode] = useState(null);
  const [lastResult, setLastResult] = useState(null);

  const startGame = useCallback(() => {
    setBoardCode(generateBoardCode());
    setScreen('game');
  }, []);

  const handleComplete = useCallback((result) => {
    setLastResult(result);
    setScreen('complete');
  }, []);

  const handleQuit = useCallback(() => setScreen('home'), []);

  if (screen === 'login') return <LoginScreen onLogin={() => setScreen('home')} />;
  if (screen === 'home') return (
    <HomeScreen
      onStart={startGame}
      lastBoardCode={boardCode}
      lastScore={lastResult?.score}
    />
  );
  if (screen === 'game') return (
    <GameScreen
      boardCode={boardCode}
      onComplete={handleComplete}
      onQuit={handleQuit}
    />
  );
  if (screen === 'complete' && lastResult) return (
    <CompleteScreen
      result={lastResult}
      onPlayAgain={startGame}
      onViewLeaderboard={() => setScreen('leaderboard')}
    />
  );
  if (screen === 'leaderboard') return (
    <LeaderboardScreen
      result={lastResult}
      boardCode={boardCode}
      onHome={() => setScreen('home')}
    />
  );
  return null;
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
